<title>Zeta Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument. Header strip, left column of three glass panels, the plane fills the rest. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#080809; --panel:#0c0c0e; --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.16);
  --fg:#ececf1; --muted:#a3a3ad; --dim:#70707c;
  --accent:#818cf8; --accent-soft:rgba(99,102,241,.18); --accent-line:rgba(129,140,248,.42); --accent-fg:#c7d2fe;
  --warn:#fbbf24;
  --serif:"Newsreader","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .z{font-family:var(--serif);font-size:30px;line-height:1;color:var(--accent-fg);font-style:italic}
.brand h1{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0}
.brand p{margin:0;color:var(--dim);font-size:12px}
.tour-btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-fg);font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:background .15s,color .15s}
.tour-btn:hover{background:rgba(99,102,241,.3);color:#fff}
.tour-btn svg{width:14px;height:14px}
.work{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;min-height:0}
.side{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;padding-right:2px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--dim)}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
dt{color:var(--muted);font-size:12px;white-space:nowrap}
dd{margin:0;font-family:var(--mono);font-size:12px;color:var(--accent-fg);text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dd.plain{color:var(--fg)}
.bar{height:12px;border-radius:6px;border:1px solid var(--line)}
.bar.hue{background:linear-gradient(90deg,hsl(180 85% 55%),hsl(240 85% 60%),hsl(300 85% 55%),hsl(360 85% 55%),hsl(60 85% 55%),hsl(120 85% 50%),hsl(180 85% 55%))}
.bar.val{background:linear-gradient(90deg,#000,#8a8a92 50%,#fff)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cap{font-size:12px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 12px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--line-strong);cursor:pointer;font-size:13px;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.sq{width:36px;padding:6px 0;text-align:center;font-family:var(--mono)}
.chip{padding:4px 10px;border-radius:999px;background:transparent;border:1px solid var(--line-strong);font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{color:#fff;border-color:var(--accent-line);background:var(--accent-soft)}
.sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub output{font-family:var(--mono);color:var(--accent-fg)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;min-height:0;min-width:0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:rgba(12,12,14,.9);border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--fg);white-space:nowrap;backdrop-filter:blur(8px)}
.tip b{color:var(--accent-fg);font-weight:500}
.clabel{position:absolute;top:8px;transform:translateX(8px);pointer-events:none;font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;white-space:nowrap}
.warn{position:absolute;left:12px;right:12px;top:36px;margin:auto;max-width:420px;background:rgba(12,12,14,.92);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12px}
.hint{position:absolute;left:12px;bottom:10px;margin:0;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:3px 9px;border-radius:999px;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}
/* tour */
.spot{position:fixed;z-index:50;border-radius:14px;pointer-events:none;box-shadow:0 0 0 200vmax rgba(0,0,0,.75);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease}
.spot.ring{outline:2px solid var(--accent-line);outline-offset:0}
.card{position:fixed;z-index:51;width:370px;max-width:calc(100vw - 24px);background:rgba(12,12,14,.95);backdrop-filter:blur(20px);border:1px solid var(--line-strong);border-radius:14px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:10px;transition:left .35s ease,top .35s ease}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);letter-spacing:.08em}
.card .badge{color:var(--accent-fg);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:1px 9px;letter-spacing:.04em}
.card h3{margin:0;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.card .body{margin:0;font-size:13.5px;color:#d4d4dc;line-height:1.75}
.card .body ul{margin:6px 0 0;padding-left:1.2em}
.card .body li{margin:3px 0}
.card .formula{font-family:var(--mono);font-size:13px;color:var(--accent-fg);background:rgba(99,102,241,.08);border:1px solid rgba(129,140,248,.2);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.card .note{margin:0;font-size:12px;color:var(--muted);line-height:1.65;border-left:2px solid var(--accent-line);padding-left:9px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.dots i.on{background:var(--accent)}
.card .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0b16;font-weight:600}
.card .btn.primary:hover{background:#a5b4fc}
.card .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.card .btn.ghost:hover{color:#fff}
.keys{font-size:11px;color:var(--dim);margin:0}
@media (max-width:760px){
  html,body{height:auto;min-height:100%}
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1;height:58vh;min-height:300px}
  .side{overflow:visible}
  .brand p{display:none}
  .card{left:12px!important;right:12px;top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){.spot,.card,.hint{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="z" aria-hidden="true">ζ</span>
      <h1>Zeta Explorer</h1>
      <p>リーマンゼータ関数 ζ(s) を複素平面で探索する</p>
    </div>
    <button class="tour-btn" id="tourBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      ツアーを見る
    </button>
  </header>

  <main class="work" id="work">
    <aside class="side">
      <section class="panel" id="p-readout" aria-live="off">
        <h2>カーソル位置</h2>
        <dl>
          <dt>s</dt><dd id="r-s">図に乗せると表示</dd>
          <dt>ζ(s)</dt><dd id="r-z">–</dd>
          <dt>|ζ(s)|</dt><dd id="r-abs">–</dd>
          <dt>arg ζ(s)</dt><dd id="r-arg">–</dd>
        </dl>
        <h2>表示範囲</h2>
        <dl>
          <dt>実部 σ</dt><dd class="plain" id="r-rs">–</dd>
          <dt>虚部 t</dt><dd class="plain" id="r-rt">–</dd>
        </dl>
      </section>

      <section class="panel" id="p-color">
        <h2>色の読み方</h2>
        <div>
          <div class="bar hue"></div>
          <div class="scale"><span>−π</span><span>−π/2</span><span>0</span><span>π/2</span><span>π</span></div>
          <p class="cap">色相 ＝ 偏角 arg ζ(s)</p>
        </div>
        <div>
          <div class="bar val"></div>
          <div class="scale"><span>0（零点）</span><span>1</span><span>∞（極）</span></div>
          <p class="cap">明るさ ＝ 絶対値 |ζ(s)|</p>
        </div>
        <label class="check"><input type="checkbox" id="contour" checked>等高線（|ζ| が2倍ごと）</label>
        <label class="check"><input type="checkbox" id="guides" checked>補助線（軸と臨界線）</label>
      </section>

      <section class="panel" id="p-tools">
        <h2>操作</h2>
        <div class="row">
          <button class="btn sq" id="zin" type="button" aria-label="拡大">＋</button>
          <button class="btn sq" id="zout" type="button" aria-label="縮小">−</button>
          <button class="btn" id="reset" type="button">初期位置</button>
        </div>
        <div>
          <div class="sub"><label for="terms">項数（計算の細かさ）</label><output id="termsOut" for="terms">–</output></div>
          <input type="range" id="terms" min="8" max="256" step="1" value="24">
        </div>
        <label class="check"><input type="checkbox" id="auto" checked>表示範囲に合わせて自動</label>
        <h2>ジャンプ</h2>
        <div class="row" id="jumps">
          <button class="chip" type="button" data-j="0.5,14.134725,2.4">零点 14.13</button>
          <button class="chip" type="button" data-j="0.5,21.022040,2.4">21.02</button>
          <button class="chip" type="button" data-j="0.5,25.010858,2.4">25.01</button>
          <button class="chip" type="button" data-j="0.5,30.424876,2.4">30.42</button>
          <button class="chip" type="button" data-j="0.5,32.935062,2.4">32.94</button>
          <button class="chip" type="button" data-j="1,0,1.6">極 s=1</button>
          <button class="chip" type="button" data-j="-4,0,4">自明な零点</button>
        </div>
      </section>
    </aside>

    <div class="stage" id="stage">
      <canvas id="gl" tabindex="0" aria-label="ζ(s) の複素平面。ドラッグで移動、ホイールで拡大縮小、矢印キーでも移動できます。"></canvas>
      <div class="clabel" id="clabel" hidden>Re(s) = 1/2</div>
      <div class="tip" id="tip" hidden></div>
      <div class="warn" id="warn" role="status" hidden></div>
      <p class="hint" id="hint">ドラッグで移動・ホイールで拡大縮小</p>
    </div>
  </main>
</div>

<div class="spot" id="spot" hidden></div>
<div class="card" id="card" role="dialog" aria-modal="false" aria-labelledby="c-title" hidden>
  <div class="meta"><span id="c-step"></span><span class="badge" id="c-badge"></span></div>
  <h3 id="c-title"></h3>
  <div class="body" id="c-body"></div>
  <div class="formula" id="c-formula"></div>
  <p class="note" id="c-note"></p>
  <div class="foot">
    <div class="dots" id="c-dots" aria-hidden="true"></div>
    <div class="row">
      <button class="btn ghost" id="c-exit" type="button">終了</button>
      <button class="btn" id="c-prev" type="button">戻る</button>
      <button class="btn primary" id="c-next" type="button">次へ</button>
    </div>
  </div>
  <p class="keys">← → キーで移動、Esc で終了</p>
</div>

'  float L=clamp(r.x,-40.0,40.0);',
'  float h=fract(r.y/(2.0*PI));',
'  float m=exp(0.9*L);',
'  float v=pow(m/(1.0+m),0.45);',
'  if(uContour>0.5){v*=0.80+0.20*fract(L/0.6931471806);}',
'  float sat=0.88*(1.0-0.75*smoothstep(0.80,0.99,v));',
'  vec3 col=hsv(h,sat,v);',
'  if(uGuides>0.5){',
'    float ax=min(abs(s.x),abs(s.y))/uScale;',
'    col=mix(col,vec3(1.0),0.30*(1.0-smoothstep(0.5*uPx,1.3*uPx,ax)));',
'    float cl=abs(s.x-0.5)/uScale;',
'    float dash=step(mod(gl_FragCoord.y,14.0*uPx),8.0*uPx);',
'    col=mix(col,vec3(1.0),0.9*dash*(1.0-smoothstep(0.7*uPx,1.5*uPx,cl)));',
'  }',
'  o=vec4(col,1.0);',
'}'].join('\n');

var U={},glOK=false;
function initGL(){
  if(!gl){showWarn('このブラウザは WebGL2 に対応していないため、図を描画できません。');return;}
  function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s));}return s;}
  try{
    var p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);
    ['uRes','uCenter','uScale','uN','uContour','uGuides','uPx'].forEach(function(n){U[n]=gl.getUniformLocation(p,n);});
    glOK=true;
  }catch(e){console.error(e);showWarn('描画の初期化に失敗しました。ブラウザを更新してもう一度開いてください。');}
}
var warnFixed=false;
function showWarn(t,fixed){warn.textContent=t;warn.hidden=false;if(fixed!==false)warnFixed=true;}

var termsEl=$('terms'),autoEl=$('auto'),termsOut=$('termsOut'),contourEl=$('contour'),guidesEl=$('guides');
function reach(){var hw=view.h*cssW/cssH;return Math.hypot(Math.abs(view.cx)+hw+1,Math.abs(view.cy)+view.h);}
function currentN(){
  if(autoEl.checked){var n=Math.max(16,Math.min(256,Math.ceil(0.5*reach())+12));termsEl.value=n;return n;}
  return +termsEl.value;
}
function clampView(){
  view.cx=Math.max(-60,Math.min(60,view.cx));
  view.cy=Math.max(-450,Math.min(450,view.cy));
  var hmin=Math.max(0.002,(Math.abs(view.cx)+Math.abs(view.cy))*2.5e-4);
  view.h=Math.max(hmin,Math.min(60,view.h));
}
function request(){if(!need){need=true;requestAnimationFrame(draw);}}
function touch(){interacting=true;clearTimeout(idleTimer);idleTimer=setTimeout(function(){interacting=false;request();},170);request();}
function draw(){
  need=false;clampView();
  var N=currentN();termsOut.textContent=N+' 項';
  if(glOK){
    var dpr=Math.min(window.devicePixelRatio||1,2)*(interacting?0.5:1);
    var w=Math.max(2,Math.round(cssW*dpr)),h=Math.max(2,Math.round(cssH*dpr));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    gl.viewport(0,0,w,h);
    gl.uniform2f(U.uRes,w,h);gl.uniform2f(U.uCenter,view.cx,view.cy);gl.uniform1f(U.uScale,2*view.h/h);
    gl.uniform1i(U.uN,N);gl.uniform1f(U.uContour,contourEl.checked?1:0);gl.uniform1f(U.uGuides,guidesEl.checked?1:0);gl.uniform1f(U.uPx,dpr);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  updateUI(N);
}
function dec(){var sc=2*view.h/cssH;return Math.max(2,Math.min(7,Math.ceil(-Math.log10(sc))+1));}
function fnum(x,d){
  if(!isFinite(x))return '∞';var a=Math.abs(x);
  if(a!==0&&(a<1e-4||a>=1e6)){var e=Math.floor(Math.log10(a));return (x/Math.pow(10,e)).toFixed(2)+'×10^'+e;}
  return x.toFixed(d);
}
function fcx(re,im,d){return fnum(re,d).replace('-','−')+(im<0?' − ':' + ')+fnum(Math.abs(im),d)+' i';}
function updateUI(N){
  var hw=view.h*cssW/cssH,d=Math.max(1,dec()-1);
  $('r-rs').textContent=(view.cx-hw).toFixed(d).replace('-','−')+' … '+(view.cx+hw).toFixed(d).replace('-','−');
  $('r-rt').textContent=(view.cy-view.h).toFixed(d).replace('-','−')+' … '+(view.cy+view.h).toFixed(d).replace('-','−');
  var cl=$('clabel'),x=cssW/2+(0.5-view.cx)/(2*view.h/cssH);
  if(guidesEl.checked&&x>0&&x<cssW-90){cl.hidden=false;cl.style.left=x+'px';}else cl.hidden=true;
  if(!warnFixed){
    var r=reach();
    if(!autoEl.checked&&N<0.3*r+6){warn.textContent='項数が足りず、この範囲では図が乱れます。項数を上げるか「自動」に戻してください。';warn.hidden=false;}
    else if(r>520){warn.textContent='虚部が大きく、項数の上限（256）では端のほうが不正確になります。';warn.hidden=false;}
    else warn.hidden=true;
  }
}

// ---- camera
function stopAnim(){if(anim){cancelAnimationFrame(anim);anim=0;}}
function animateTo(cx,cy,h,ms){
  stopAnim();
  if(reduced){view.cx=cx;view.cy=cy;view.h=h;request();return;}
  var a={cx:view.cx,cy:view.cy,h:view.h},t0=performance.now();ms=ms||900;
  (function step(now){
    var k=Math.min(1,(now-t0)/ms),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    view.h=Math.exp(Math.log(a.h)+(Math.log(h)-Math.log(a.h))*e);
    view.cx=a.cx+(cx-a.cx)*e;view.cy=a.cy+(cy-a.cy)*e;
    touch();
    anim=k<1?requestAnimationFrame(step):0;
  })(t0);
}
function zoomAt(px,py,f){
  var sc=2*view.h/cssH,wx=view.cx+(px-cssW/2)*sc,wy=view.cy-(py-cssH/2)*sc;
  view.h*=f;clampView();sc=2*view.h/cssH;
  view.cx=wx-(px-cssW/2)*sc;view.cy=wy+(py-cssH/2)*sc;touch();
}
function world(px,py){var sc=2*view.h/cssH;return [view.cx+(px-cssW/2)*sc,view.cy-(py-cssH/2)*sc];}

// ---- pointer input
var pts=new Map(),pinch=0,hint=$('hint'),tip=$('tip');
function local(e){var b=canvas.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
function used(){hint.classList.add('gone');}
canvas.addEventListener('pointerdown',function(e){
  stopAnim();try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  pts.set(e.pointerId,local(e));canvas.classList.add('drag');tip.hidden=true;
  if(pts.size===2){var a=Array.from(pts.values());pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}
});
canvas.addEventListener('pointermove',function(e){
  var p=local(e);
  if(!pts.has(e.pointerId)){hover(p);return;}
  var prev=pts.get(e.pointerId);pts.set(e.pointerId,p);
  if(pts.size===1){
    var sc=2*view.h/cssH;view.cx-=(p[0]-prev[0])*sc;view.cy+=(p[1]-prev[1])*sc;used();touch();
  }else if(pts.size===2){
    var a=Array.from(pts.values()),d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
    if(pinch>0&&d>0){zoomAt((a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2,pinch/d);used();}
    pinch=d;
  }
});
function up(e){
  var wasTap=pts.size===1&&e.pointerType!=='mouse';
  pts.delete(e.pointerId);if(pts.size<2)pinch=0;
  if(!pts.size){canvas.classList.remove('drag');if(wasTap&&e.type==='pointerup')hover(local(e));}
}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',function(){tip.hidden=true;});
canvas.addEventListener('wheel',function(e){
  e.preventDefault();stopAnim();var p=local(e),dy=e.deltaMode===1?e.deltaY*32:e.deltaY;
  zoomAt(p[0],p[1],Math.exp(Math.max(-1,Math.min(1,dy*0.0016))));used();hover(p);
},{passive:false});
canvas.addEventListener('dblclick',function(e){var p=local(e),w=world(p[0],p[1]);animateTo(w[0],w[1],view.h/2.5,500);});
canvas.addEventListener('keydown',function(e){
  var s=view.h*0.15,k=e.key;
  if(k==='ArrowLeft')view.cx-=s;else if(k==='ArrowRight')view.cx+=s;else if(k==='ArrowUp')view.cy+=s;else if(k==='ArrowDown')view.cy-=s;
  else if(k==='+'||k===';'||k==='=')view.h/=1.4;else if(k==='-')view.h*=1.4;else if(k==='0'){animateTo(HOME.cx,HOME.cy,HOME.h);e.preventDefault();return;}
  else return;
  e.preventDefault();stopAnim();touch();
});
function hover(p){
  var w=world(p[0],p[1]),d=dec(),z=zetaJS(w[0],w[1]),lm=z[0],ph=z[1];
  ph=ph-2*Math.PI*Math.round(ph/(2*Math.PI));
  var sTxt=fcx(w[0],w[1],d),zTxt,aTxt;
  if(lm>650){var e10=(lm/Math.LN10).toFixed(1);zTxt='非常に大きい';aTxt='約 10^'+e10;}
  else{var m=Math.exp(lm);zTxt=fcx(m*Math.cos(ph),m*Math.sin(ph),4);aTxt=fnum(m,5);}
  var argTxt=(ph/Math.PI).toFixed(3).replace('-','−')+' π';
  $('r-s').textContent=sTxt;$('r-z').textContent=zTxt;$('r-abs').textContent=aTxt;$('r-arg').textContent=argTxt;
  tip.innerHTML='';
  var l1=document.createElement('div');l1.innerHTML='<b>s</b> = ';l1.appendChild(document.createTextNode(sTxt));
  var l2=document.createElement('div');l2.innerHTML='<b>|ζ|</b> = ';l2.appendChild(document.createTextNode(aTxt));
  tip.appendChild(l1);tip.appendChild(l2);tip.hidden=false;
  var tw=tip.offsetWidth,th=tip.offsetHeight,x=p[0]+14,y=p[1]+14;
  if(x+tw>cssW-6)x=p[0]-tw-10;if(y+th>cssH-6)y=p[1]-th-10;
  tip.style.left=Math.max(6,x)+'px';tip.style.top=Math.max(6,y)+'px';
}

// ---- controls
$('zin').addEventListener('click',function(){animateTo(view.cx,view.cy,view.h/1.8,350);});
$('zout').addEventListener('click',function(){animateTo(view.cx,view.cy,Math.min(60,view.h*1.8),350);});
$('reset').addEventListener('click',function(){animateTo(HOME.cx,HOME.cy,HOME.h);});
termsEl.addEventListener('input',function(){autoEl.checked=false;request();});
autoEl.addEventListener('change',request);contourEl.addEventListener('change',request);guidesEl.addEventListener('change',request);
$('jumps').addEventListener('click',function(e){var b=e.target.closest('[data-j]');if(!b)return;var v=b.dataset.j.split(',').map(Number);animateTo(v[0],v[1],v[2]);});

new ResizeObserver(function(){var b=stage.getBoundingClientRect();cssW=Math.max(1,b.width);cssH=Math.max(1,b.height);request();if(tour.open)tour.place();}).observe(stage);

// ---- tour
var STEPS=[
 {target:'#work',place:'center',badge:'はじめに',title:'ゼータ関数へようこそ',
  body:'この画面は、リーマンゼータ関数 ζ(s) を1枚の地図として描いたものです。画面上の1点が1つの複素数 s で、その点の色が ζ(s) の値を表します。',
  formula:'ζ(s) = 1 + 1/2ˢ + 1/3ˢ + 1/4ˢ + ⋯',
  note:'この足し算が意味を持つのは本来 Re(s) > 1 の範囲だけです。ここでは解析接続という方法で平面全体に延長した値を描いています。'},
 {target:'#p-readout',place:'right',badge:'座標',title:'複素平面の読み方',
  body:'横方向が実部 σ、縦方向が虚部 t です。地図の経度と緯度のように、s = σ + it が1点の住所になります。図にカーソルを乗せると、その点の s と ζ(s) がここに表示されます。',
  formula:'s = σ + i t',
  note:'図をドラッグすると移動、ホイール（タッチならピンチ）で拡大縮小できます。ツアーの途中でも操作できます。'},
 {target:'#stage',place:'inside',badge:'零点',title:'臨界線と非自明な零点',
  body:'白い破線が臨界線 Re(s) = 1/2 です。いま中央に寄せた暗い点が最初の非自明な零点で、ここで ζ(s) がちょうど 0 になります。すべての色が1点に集まっているのが目印です。',
  formula:'s ≈ 1/2 + 14.1347 i',
  note:'非自明な零点はすべてこの線上にある、というのがリーマン予想です。これまでに計算された零点は、どれも線上にあります。',
  action:function(){animateTo(0.5,14.134725,2.4,1100);}},
 {target:'#p-color',place:'right',badge:'色',title:'色と等高線',
  body:'色相は ζ(s) の偏角（向き）を表します。零点のまわりを1周すると、色も虹を1周します。明るさは絶対値 |ζ(s)| で、0 に近いほど暗く、大きいほど明るくなります。',
  formula:'色相 = arg ζ(s)　　明るさ = |ζ(s)|',
  note:'縞模様は等高線で、|ζ(s)| が2倍になるごとに1本入ります。「等高線」のチェックを外すと消せます。'},
 {target:'#p-tools',place:'right',badge:'道具',title:'探索の道具',
  body:'＋ と − で拡大縮小、「初期位置」で最初の画面に戻ります。「ジャンプ」からは零点や極へ直接移動できます。項数は計算の細かさで、ふだんは「自動」のままで正しく描けます。',
  formula:'',
  note:'虚部 t が大きい場所ほど多くの項が必要になり、描画は重くなります。'},
 {target:null,place:'center',badge:'完了',title:'ここからは自由に',
  body:'ひととおり見終わりました。次の3つを探してみてください。<ul><li>2つ目の零点：臨界線を上にたどって t ≈ 21.02</li><li>自明な零点：実軸の左側、s = −2, −4, −6, …</li><li>極 s = 1：ここだけ値が無限大になり、白く光ります</li></ul>',
  formula:'',note:''}
];
var spot=$('spot'),card=$('card');
var tour={open:false,i:0,
  start:function(){this.open=true;this.i=0;spot.hidden=false;card.hidden=false;this.show();$('c-next').focus({preventScroll:true});},
  close:function(){this.open=false;spot.hidden=true;card.hidden=true;$('tourBtn').focus({preventScroll:true});},
  next:function(){if(this.i<STEPS.length-1){this.i++;this.show();}else this.close();},
  prev:function(){if(this.i>0){this.i--;this.show();}},
  show:function(){
    var st=STEPS[this.i],last=this.i===STEPS.length-1,n=STEPS.length-1;
    $('c-step').textContent=last?'ツアー完了':'ステップ '+(this.i+1)+' / '+n;
    $('c-badge').textContent=st.badge;$('c-title').textContent=st.title;$('c-body').innerHTML=st.body;
    $('c-formula').textContent=st.formula;$('c-formula').hidden=!st.formula;
    $('c-note').textContent=st.note;$('c-note').hidden=!st.note;
    $('c-prev').hidden=this.i===0;$('c-next').textContent=last?'探索をはじめる':'次へ';$('c-exit').hidden=last;
    var dots=$('c-dots');dots.innerHTML='';for(var k=0;k<STEPS.length;k++){var d=document.createElement('i');if(k===this.i)d.className='on';dots.appendChild(d);}
    if(st.action)st.action();
    var el=st.target&&document.querySelector(st.target);
    if(el&&window.innerWidth<=760)el.scrollIntoView({block:'start'});
    this.place();
  },
  place:function(){
    var st=STEPS[this.i],el=st.target&&document.querySelector(st.target),vw=window.innerWidth,vh=window.innerHeight,r;
    if(el){var b=el.getBoundingClientRect(),pad=st.place==='inside'?0:6;r={l:b.left-pad,t:b.top-pad,w:b.width+2*pad,h:b.height+2*pad};spot.classList.add('ring');}
    else{r={l:vw/2,t:vh/2,w:0,h:0};spot.classList.remove('ring');}
    spot.style.left=r.l+'px';spot.style.top=r.t+'px';spot.style.width=r.w+'px';spot.style.height=r.h+'px';
    if(vw<=760){card.style.left='';card.style.top='';return;}
    var cw=card.offsetWidth,ch=card.offsetHeight,x,y;
    if(st.place==='right'&&r.l+r.w+16+cw<=vw-12){x=r.l+r.w+16;y=r.t;}
    else if(st.place==='inside'){x=r.l+20;y=r.t+r.h-ch-20;}
    else{x=(vw-cw)/2;y=(vh-ch)/2;}
    card.style.left=Math.max(12,Math.min(vw-cw-12,x))+'px';card.style.top=Math.max(12,Math.min(vh-ch-12,y))+'px';
  }
};
$('tourBtn').addEventListener('click',function(){tour.start();});
$('c-next').addEventListener('click',function(){tour.next();});
$('c-prev').addEventListener('click',function(){tour.prev();});
$('c-exit').addEventListener('click',function(){tour.close();});
window.addEventListener('keydown',function(e){
  if(!tour.open)return;
  var onBtn=e.target&&e.target.closest&&e.target.closest('button');
  if(e.key==='Escape')tour.close();
  else if(e.key==='ArrowRight'||(e.key==='Enter'&&!onBtn))tour.next();
  else if(e.key==='ArrowLeft')tour.prev();
  else return;
  e.preventDefault();e.stopPropagation();
},true);
window.addEventListener('resize',function(){if(tour.open)tour.place();});
window.addEventListener('scroll',function(){if(tour.open)tour.place();},{passive:true});

initGL();
var b0=stage.getBoundingClientRect();cssW=Math.max(1,b0.width);cssH=Math.max(1,b0.height);request();
})();
</script>
